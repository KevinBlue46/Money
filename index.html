<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>我的記帳本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：手機單欄；寬度 900px 以上時，左側固定記帳表單，右側為類別統計、每日長條圖與明細。 */
:root {
  --bg: #07090C;
  --surface: #12161C;
  --surface-2: #191E26;
  --fg: #E8EDF3;
  --muted: #98A4B4;
  --line: #2A313C;
  --line-soft: #1F2630;
  --grid: rgba(140, 171, 238, 0.06);
  --accent: #8CABEE;
  --accent-ink: #0B1630;
  --accent-soft: #1E2B4A;
  --income: #4DC4AB;
  --warn: #F2906F;
  --warn-soft: #3A2119;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, dl, dd, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1080px; margin: 0 auto; }

/* 頂部 */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.04em; line-height: 1.2; }
.brand p { color: var(--muted); font-size: 13px; }
.month { display: flex; align-items: center; gap: 6px; }
.month-label { min-width: 7.5em; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 20px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.ghost:hover:not(:disabled) { background: var(--surface-2); }
.ghost:disabled { opacity: 0.45; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 12px 16px; font-weight: 700; cursor: pointer; min-height: 46px; }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.primary:disabled { opacity: 0.5; cursor: default; }
.primary.sm, .ghost.sm { width: auto; min-height: 40px; padding: 8px 14px; }

/* 總覽 */
.summary {
  display: grid; gap: 20px;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  border: 1px solid var(--line); border-radius: 12px; padding: 20px;
}
.sum-main { min-width: 0; }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: 0.06em; }
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 9vw, 52px); line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.big small { font-size: 0.42em; font-weight: 600; margin-right: 0.15em; letter-spacing: 0.02em; color: var(--muted); }
.sum-side { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sum-side div { min-width: 0; }
.sum-side dt { font-size: 13px; color: var(--muted); }
.sum-side dd { font-family: var(--font-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pos { color: var(--income); }
.neg-bal { color: var(--warn); }
.budget { margin-top: 14px; max-width: 460px; }
.b-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.b-state.hot { color: var(--warn); font-weight: 700; }
.meter { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter.hot i { background: var(--warn); }
.budget-form { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.budget-form label { font-size: 13px; color: var(--muted); }
.budget-form input { width: 9em; }

/* 版面 */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.col-left, .col-right { min-width: 0; }
.col-right { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 14px; }
.card-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.03em; }
.hint { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (min-width: 700px) {
  .summary { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; padding: 24px; }
  .sum-side { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .sum-side div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--line-soft); padding-bottom: 6px; }
}
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); align-items: start; }
  .col-left { position: sticky; top: 16px; }
}

/* 目前餘額 */
.assets { display: grid; gap: 16px; margin-top: 16px; }
.assets-main, .assets-side { min-width: 0; }
.assets-main .big { font-size: clamp(30px, 8vw, 42px); }
.a-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.arow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.aval { font-family: var(--font-mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.assets-side .link { margin-top: 8px; }
.open-form { display: grid; gap: 12px; }
.open-form .actions { display: flex; gap: 8px; }
@media (min-width: 700px) { .assets { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; padding: 24px; } }

/* 表單 */
.form { display: grid; gap: 16px; }
.field > span, .form legend { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; padding: 0; }
.form fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
input[type="text"], input[type="number"], input[type="date"] {
  width: 100%; min-height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
}
input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus { border-color: var(--accent); }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.money { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.money:focus-within { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }
.money .cur { font-family: var(--font-mono); color: var(--muted); font-size: 15px; }
.money input { border: 0; padding: 4px 0; min-height: 0; background: transparent; font-family: var(--font-mono); font-size: 26px; font-weight: 500; outline: none; }
.err { color: var(--warn); font-size: 13px; font-weight: 500; }

.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; position: relative; }
.seg.full { display: grid; grid-template-columns: 1fr 1fr; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 8px 16px; border-radius: 7px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg.alt input:checked + label { background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.seg.sm label { padding: 5px 12px; font-size: 13px; }
.seg.sm input:checked + label { background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.chips label:hover { background: var(--surface-2); }
.chips input:checked + label { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chips input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 帳戶收支 */
.acct-list { display: grid; gap: 14px; }
.acct + .acct { border-top: 1px solid var(--line-soft); padding-top: 14px; }
.acct-name { font-weight: 700; margin-bottom: 6px; }
.acct-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.acct-stats div { min-width: 0; }
.acct-stats dt { font-size: 12px; color: var(--muted); }
.acct-stats dd { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tag.m { color: var(--fg); }

/* 類別長條 */
.bd { display: grid; gap: 14px; }
.bd-row .bd-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 5px; }
.bd-amt { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.bd-pct { color: var(--muted); margin-left: 6px; }
.bd-track { height: 8px; border-radius: 4px; background: var(--line-soft); }
.bd-track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }

/* 每日長條圖 */
.chart { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 6px; padding-top: 8px; }
.yaxis { display: flex; flex-direction: column; justify-content: space-between; height: 140px; text-align: right; font: 500 11px/1 var(--font-mono); color: var(--muted); }
.yaxis span:first-child { transform: translateY(-50%); }
.yaxis span:last-child { transform: translateY(50%); }
.plot { position: relative; height: 140px; }
.gl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--line); }
.gl.g0 { bottom: 0; border-top: 1px solid var(--line); }
.gl.g50 { top: 50%; }
.gl.g100 { top: 0; }
.bars { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; touch-action: pan-y; }
.bars:focus-visible { outline-offset: 4px; }
.col { display: flex; align-items: flex-end; justify-content: center; height: 100%; border-radius: 4px 4px 0 0; }
.col.sel { background: var(--accent-soft); }
.col i { display: block; width: 100%; max-width: 16px; min-height: 3px; background: var(--accent); border-radius: 4px 4px 0 0; }
.col i.zero { height: 2px; min-height: 0; background: var(--line); border-radius: 0; }
.bars.has-sel .col:not(.sel) i:not(.zero) { opacity: 0.4; }
.xaxis { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; height: 16px; }
.xl { position: relative; }
.xl span { position: absolute; left: 50%; transform: translateX(-50%); font: 500 11px/1 var(--font-mono); color: var(--muted); }
.xl.today span { color: var(--accent); font-weight: 700; }

/* 明細 */
.day-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
.day-head .d { color: var(--fg); }
.day:first-child .day-head { padding-top: 0; }
.tx { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.tx-main { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.tx-note { overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 12px; line-height: 1.6; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap; }
.tag.inc { color: var(--income); border-color: var(--income); }
.tag.sample { border-style: dashed; }
.tx-amt { font-family: var(--font-mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tx-amt.inc { color: var(--income); }
.del { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 3.6em; font-size: 13px; color: var(--fg); cursor: pointer; }
.del:hover { color: var(--warn); border-color: var(--warn); }
.del.is-confirm { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); font-weight: 700; }
.list-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.foot-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost.is-confirm { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); font-weight: 700; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.empty .ghost { margin-top: 12px; }
.note { margin-top: 20px; font-size: 12.5px; color: var(--muted); max-width: 60ch; }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; visibility: hidden; transition: opacity 0.18s, transform 0.18s, visibility 0.18s; z-index: 20; }
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.toast.bad { background: var(--warn); color: var(--bg); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
/* 登入畫面與使用者列 */
.auth-ov { position: fixed; inset: 0; background: var(--bg); z-index: 900; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.auth-box { width: 100%; max-width: 380px; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; }
.auth-box h2 { font-family: var(--font-display); font-size: 26px; text-align: center; letter-spacing: 0.06em; }
.auth-box input[type="password"] { width: 100%; min-height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.auth-box input[type="password"]:focus { border-color: var(--accent); }
.auth-note { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.userbar { margin-top: 4px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
.userbar .ub-sync { font-family: var(--font-mono); font-size: 12px; }

</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>記帳本</h1>
      <p id="today-line"></p>
    </div>
    <nav class="month" aria-label="月份切換">
      <button class="icon-btn" id="prev" type="button" aria-label="上個月">‹</button>
      <div class="month-label" id="month-label"></div>
      <button class="icon-btn" id="next" type="button" aria-label="下個月">›</button>
      <button class="ghost" id="this-month" type="button">本月</button>
    </nav>
  </header>

  <section class="summary" aria-label="本月總覽">
    <div class="sum-main">
      <div class="eyebrow">本月支出</div>
      <div class="big" id="sum-expense"></div>
      <div id="budget-area"></div>
      <form class="budget-form" id="budget-form" hidden novalidate>
        <label for="budget-input">每月預算 NT$</label>
        <input id="budget-input" type="number" inputmode="numeric" min="0" step="100" placeholder="例如 20000">
        <button class="primary sm" type="submit">儲存</button>
        <button class="ghost sm" id="budget-cancel" type="button">取消</button>
      </form>
    </div>
    <dl class="sum-side">
      <div><dt>收入</dt><dd id="sum-income"></dd></div>
      <div><dt>結餘</dt><dd id="sum-balance"></dd></div>
      <div><dt>日均支出</dt><dd id="sum-avg"></dd></div>
    </dl>
  </section>

  <section class="card assets" aria-label="目前餘額">
    <div class="assets-main">
      <div class="eyebrow">目前總金額</div>
      <div class="big" id="assets-total"></div>
      <p class="a-note">含起始金額，累計所有月份的收入與支出。</p>
    </div>
    <div class="assets-side">
      <div id="assets-rows"></div>
      <button class="link" id="open-edit" type="button">設定起始金額</button>
      <form class="open-form" id="open-form" hidden novalidate>
        <label class="field" for="open-cash"><span>現金起始金額</span><input id="open-cash" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
        <label class="field" for="open-debit"><span>金融卡起始金額</span><input id="open-debit" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
        <div class="actions">
          <button class="primary sm" type="submit">儲存</button>
          <button class="ghost sm" id="open-cancel" type="button">取消</button>
        </div>
      </form>
    </div>
  </section>

  <main class="grid">
    <div class="col-left">
      <section class="card" aria-label="新增帳目">
        <form class="form" id="entry-form" novalidate>
          <div class="seg full" role="radiogroup" aria-label="收支類型">
            <input type="radio" name="type" id="type-expense" value="expense" checked>
            <label for="type-expense">支出</label>
            <input type="radio" name="type" id="type-income" value="income">
            <label for="type-income">收入</label>
          </div>
          <label class="field" for="amount">
            <span>金額</span>
            <div class="money"><span class="cur">NT$</span><input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="0" autocomplete="off"></div>
          </label>
          <fieldset>
            <legend>帳戶</legend>
            <div class="seg alt full" role="radiogroup" aria-label="帳戶">
              <input type="radio" name="method" id="method-cash" value="cash" checked>
              <label for="method-cash">現金</label>
              <input type="radio" name="method" id="method-debit" value="debit">
              <label for="method-debit">金融卡</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>類別</legend>
            <div class="chips" id="cat-chips"></div>
          </fieldset>
          <label class="field" for="date"><span>日期</span><input id="date" name="date" type="date"></label>
          <label class="field" for="note"><span>備註（選填）</span><input id="note" name="note" type="text" maxlength="60" placeholder="例如：午餐便當" autocomplete="off"></label>
          <p class="err" id="form-err" role="alert" hidden></p>
          <button class="primary" id="submit" type="submit">記一筆</button>
        </form>
      </section>
    </div>

    <div class="col-right">
      <section class="card" aria-label="帳戶收支">
        <div class="card-head"><h2>帳戶收支</h2><span class="hint">本月</span></div>
        <div id="accounts"></div>
      </section>

      <section class="card" aria-label="支出類別">
        <div class="card-head"><h2>支出類別</h2><span class="hint" id="bd-total"></span></div>
        <div id="breakdown"></div>
      </section>

      <section class="card" aria-label="每日支出">
        <div class="card-head"><h2>每日支出</h2><span class="hint" id="chart-readout"></span></div>
        <div id="daily-chart"></div>
      </section>

      <section class="card" aria-label="明細">
        <div class="card-head">
          <h2>明細</h2>
          <div class="seg sm" role="radiogroup" aria-label="篩選明細">
            <input type="radio" name="filter" id="f-all" value="all" checked><label for="f-all">全部</label>
            <input type="radio" name="filter" id="f-expense" value="expense"><label for="f-expense">支出</label>
            <input type="radio" name="filter" id="f-income" value="income"><label for="f-income">收入</label>
          </div>
        </div>
        <div id="list"></div>
        <div class="list-foot">
          <div class="foot-actions">
            <button class="ghost" id="export" type="button">匯出 CSV</button>
            <button class="ghost" id="clear-month" type="button">清除本月</button>
            <button class="ghost" id="clear-all" type="button">清除全部</button>
          </div>
          <span id="sample-note"></span>
        </div>
      </section>
    </div>
  </main>

  <p class="note" id="store-note"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ★★★ 只需要改這一行：把 Apps Script 部署後的網址貼在引號裡面 ★★★ */
window.APP_CONFIG = { SHEET_URL: 'https://script.google.com/macros/s/AKfycbxd2auOQlcaBC4OnZ7SEroHl7MGLifh8NeesFEpLsdXEPUq6v-QrugjnYJtTCh_Upo_RA/exec' };
</script>

<script>
(function () {
  'use strict';

  var EXPENSE_CATS = ['餐飲', '交通', '購物', '居家水電', '娛樂', '醫療', '學習', '其他'];
  var INCOME_CATS = ['薪資', '獎金', '投資', '兼職', '其他'];
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  var LS_KEY = 'ledger.v1';

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dstr(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function todayParts() { var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() }; }
  function money(n) { return 'NT$' + Math.round(n).toLocaleString('zh-TW'); }
  function bigMoney(n) { return (n < 0 ? '−' : '') + '<small>NT$</small>' + Math.abs(Math.round(n)).toLocaleString('zh-TW'); }
  function signed(n) { return (n < 0 ? '−' : '+') + money(Math.abs(n)); }
  function mname(k) { return k === 'cash' ? '現金' : (k === 'debit' ? '金融卡' : ''); }
  function readOpening(x) {
    x = x || {};
    return { cash: +x.cash > 0 ? Math.round(+x.cash) : 0, debit: +x.debit > 0 ? Math.round(+x.debit) : 0 };
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var T0 = todayParts();
  var state = {
    loaded: false,
    mode: 'loading',          // loading | cloud | local
    txs: [],
    budget: 0,
    opening: { cash: 0, debit: 0 },
    editingOpening: false,
    view: { y: T0.y, m: T0.m },
    filter: 'all',
    type: 'expense',
    lastCat: { expense: '餐飲', income: '薪資' },
    confirmId: null,
    confirmBulk: null,
    editingBudget: false,
    sel: null,
    chart: null,
    error: '',
    persistFail: false
  };
  var cloud = null;
  var confirmTimer = null;
  var bulkTimer = null;
  var toastTimer = null;

  /* ---------- 儲存層 ---------- */
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        state.txs = Array.isArray(o.txs) ? o.txs : [];
        state.budget = +o.budget > 0 ? +o.budget : 0;
        state.opening = readOpening(o.opening);
      }
    } catch (e) { /* 讀不到就從空帳本開始 */ }
    state.loaded = true;
  }
  function saveLocal() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ txs: state.txs, budget: state.budget, opening: state.opening }));
      state.persistFail = false;
    } catch (e) {
      state.persistFail = true;
    }
  }
  function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- Google 試算表帳號系統 ---------- */
  var SHEET_URL = (window.APP_CONFIG && window.APP_CONFIG.SHEET_URL) || '';
  var USE_SHEET = SHEET_URL.indexOf('https://script.google.com') === 0;
  var SES_KEY = 'ledger.session';
  var session = null;      // { user, token, exp }
  var queue = [];          // 還沒傳到試算表的操作
  var flushing = false;

  function qKey() { return 'ledger.queue.' + (session ? session.user : ''); }
  function cKey() { return 'ledger.cache.' + (session ? session.user : ''); }
  function loadQueue() {
    try { queue = JSON.parse(localStorage.getItem(qKey()) || '[]'); } catch (e) { queue = []; }
    if (!Array.isArray(queue)) queue = [];
  }
  function saveQueue() { try { localStorage.setItem(qKey(), JSON.stringify(queue)); } catch (e) {} }
  function saveCache() {
    try { localStorage.setItem(cKey(), JSON.stringify({ txs: state.txs, budget: state.budget, opening: state.opening })); } catch (e) {}
  }
  function loadCache() {
    try { var c = JSON.parse(localStorage.getItem(cKey()) || 'null'); return c && Array.isArray(c.txs) ? c : null; } catch (e) { return null; }
  }
  function setSync(text) { var el = $('sync-text'); if (el) el.textContent = text; }

  async function api(action, payload) {
    var ctl = new AbortController();
    var tm = setTimeout(function () { ctl.abort(); }, 25000);
    try {
      var res = await fetch(SHEET_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, payload || {})), signal: ctl.signal });
      return await res.json();
    } finally { clearTimeout(tm); }
  }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  async function hashPw(user, pw) {
    if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    var enc = new TextEncoder();
    var key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('ledger-v2|' + user), iterations: 100000, hash: 'SHA-256' }, key, 256);
    return hex(bits);
  }

  /* 背景同步：一次傳一批，失敗會自動重試，不會讓畫面卡住 */
  async function flush() {
    if (flushing || !session) return;
    flushing = true;
    var authFail = false;
    try {
      setSync(queue.length ? '同步中…' : '已同步');
      while (queue.length && session) {
        var op = queue[0], n = 1, p = op.p;
        if (op.a === 'add') {
          var txs = op.p.txs.slice();
          while (n < queue.length && queue[n].a === 'add' && txs.length + queue[n].p.txs.length <= 100) { txs = txs.concat(queue[n].p.txs); n++; }
          p = { txs: txs };
        }
        var r = await api(op.a, Object.assign({ token: session.token }, p));
        if (r.ok) { queue.splice(0, n); saveQueue(); }
        else if (r.code === 'auth') { authFail = true; break; }
        else { queue.splice(0, n); saveQueue(); toast('有一筆資料同步被拒絕：' + (r.error || ''), true); }
      }
      if (authFail) { sessionExpired('登入已過期，請重新登入'); return; }
      setSync('已同步');
    } catch (e) {
      setSync('同步失敗，稍後自動重試');
      setTimeout(flush, 8000);
    } finally { flushing = false; }
  }
  function enqueue(a, p) { queue.push({ a: a, p: p }); saveQueue(); saveCache(); flush(); }

  async function addTx(data) {
    data.createdAt = Date.now();
    if (cloud) {
      await cloud.txCol.add(data);
    } else {
      var rec = Object.assign({ id: newId() }, data);
      state.txs = state.txs.concat([rec]);
      if (state.mode === 'sheet') enqueue('add', { txs: [rec] }); else saveLocal();
      render();
    }
  }
  async function removeTx(id) {
    if (cloud) {
      await cloud.txCol.doc(id).delete();
    } else {
      state.txs = state.txs.filter(function (t) { return t.id !== id; });
      if (state.mode === 'sheet') enqueue('del', { ids: [id] }); else saveLocal();
      render();
    }
  }
  async function removeMany(ids) {
    if (cloud) {
      for (var i = 0; i < ids.length; i++) await cloud.txCol.doc(ids[i]).delete();
    } else {
      var set = {};
      ids.forEach(function (id) { set[id] = true; });
      state.txs = state.txs.filter(function (t) { return !set[t.id]; });
      if (state.mode === 'sheet') { for (var k = 0; k < ids.length; k += 500) enqueue('del', { ids: ids.slice(k, k + 500) }); } else saveLocal();
      render();
    }
  }
  async function saveSettings(patch) {
    var next = { budget: state.budget, opening: state.opening };
    if (patch.budget != null) next.budget = patch.budget;
    if (patch.opening) next.opening = patch.opening;
    if (cloud) {
      await cloud.metaDoc.set(next);
    } else {
      state.budget = next.budget;
      state.opening = next.opening;
      if (state.mode === 'sheet') enqueue('settings', { budget: next.budget, opening: next.opening }); else saveLocal();
      render();
    }
  }

  /* ---------- 登入 / 註冊畫面 ---------- */
  function showAuth(msg) {
    var old = $('auth-ov');
    if (old) old.remove();
    var ov = document.createElement('div');
    ov.className = 'auth-ov';
    ov.id = 'auth-ov';
    ov.innerHTML =
      '<form class="auth-box" id="auth-form" novalidate>' +
      '<h2>記帳本</h2>' +
      '<div class="seg full" role="radiogroup" aria-label="登入或註冊">' +
      '<input type="radio" name="authmode" id="am-login" value="login" checked><label for="am-login">登入</label>' +
      '<input type="radio" name="authmode" id="am-register" value="register"><label for="am-register">註冊新帳號</label></div>' +
      '<label class="field"><span>帳號</span><input id="au-user" type="text" maxlength="20" autocomplete="username" autocapitalize="none" placeholder="2～20 個中文、英文、數字或底線"></label>' +
      '<label class="field"><span>密碼（至少 6 個字）</span><input id="au-pw" type="password" autocomplete="current-password"></label>' +
      '<label class="field reg-only" hidden><span>再輸入一次密碼</span><input id="au-pw2" type="password" autocomplete="new-password"></label>' +
      '<label class="field reg-only" hidden><span>邀請碼（向管理員索取）</span><input id="au-code" type="text" autocomplete="off"></label>' +
      '<p class="auth-note">你的帳目會存在管理員的 Google 試算表。密碼經過加密，管理員看不到；但管理員看得到帳目內容，請不要把這個密碼拿去用在其他重要網站。</p>' +
      '<p class="err" id="au-err" role="alert" hidden></p>' +
      '<button class="primary" id="au-submit" type="submit">登入</button></form>';
    document.body.appendChild(ov);
    var regs = ov.querySelectorAll('.reg-only');
    function setMode() {
      var m = ov.querySelector('input[name="authmode"]:checked').value;
      for (var i = 0; i < regs.length; i++) regs[i].hidden = m !== 'register';
      $('au-submit').textContent = m === 'register' ? '註冊並登入' : '登入';
      $('au-pw').setAttribute('autocomplete', m === 'register' ? 'new-password' : 'current-password');
      $('au-err').hidden = true;
    }
    ov.querySelectorAll('input[name="authmode"]').forEach(function (r) { r.addEventListener('change', setMode); });
    $('auth-form').addEventListener('submit', onAuthSubmit);
    if (msg) authErr(msg);
    $('au-user').focus();
  }
  function authErr(m) { var e = $('au-err'); if (e) { e.textContent = m; e.hidden = false; } }

  async function onAuthSubmit(e) {
    e.preventDefault();
    var mode = document.querySelector('input[name="authmode"]:checked').value;
    var user = $('au-user').value.trim().toLowerCase();
    var pw = $('au-pw').value;
    if (!/^[a-z0-9_一-龥]{2,20}$/.test(user)) { authErr('帳號請用 2～20 個中文、英文、數字或底線。'); return; }
    if (pw.length < 6) { authErr('密碼至少要 6 個字。'); return; }
    var code = '';
    if (mode === 'register') {
      if (pw !== $('au-pw2').value) { authErr('兩次輸入的密碼不一樣。'); return; }
      code = $('au-code').value.trim();
      if (!code) { authErr('請輸入邀請碼。'); return; }
    }
    var btn = $('au-submit');
    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '處理中…';
    try {
      var h = await hashPw(user, pw);
      var r = await api(mode, { user: user, pw: h, code: code });
      if (!r.ok) { authErr(r.error || '失敗了，請再試一次。'); return; }
      session = { user: r.user, token: r.token, exp: r.exp };
      try { localStorage.setItem(SES_KEY, JSON.stringify(session)); } catch (e2) {}
      $('auth-ov').remove();
      afterLogin();
    } catch (err) {
      authErr(err && err.message === 'nocrypto' ? '這個瀏覽器不支援加密，請改用 https 網址或新版瀏覽器。' : '連不上伺服器，請檢查網路後再試。');
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  function renderUserBar() {
    var bar = $('userbar');
    if (!session) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'userbar';
      bar.className = 'userbar';
      bar.innerHTML = '<span id="ub-name"></span><span class="ub-sync" id="sync-text"></span><button type="button" class="link" id="ub-out">登出</button>';
      document.querySelector('.brand').appendChild(bar);
      $('ub-out').addEventListener('click', onLogout);
    }
    $('ub-name').textContent = '👤 ' + session.user;
  }

  function resetState() {
    state.txs = []; state.budget = 0; state.opening = { cash: 0, debit: 0 };
    state.loaded = false; state.error = ''; state.confirmId = null; state.confirmBulk = null;
  }
  function sessionExpired(msg) {
    try { localStorage.removeItem(SES_KEY); } catch (e) {}
    session = null; queue = [];
    resetState(); renderUserBar(); render(); showAuth(msg);
  }
  async function onLogout() {
    if (queue.length) {
      await flush();
      if (queue.length && !confirm('還有 ' + queue.length + ' 筆資料沒同步到雲端（可能沒網路），現在登出會遺失。確定要登出嗎？')) return;
    }
    try { localStorage.removeItem(SES_KEY); localStorage.removeItem(cKey()); localStorage.removeItem(qKey()); } catch (e) {}
    session = null; queue = [];
    resetState(); renderUserBar(); render(); showAuth();
  }

  async function afterLogin() {
    loadQueue();
    renderUserBar();
    resetState();
    render();
    await loadRemote();
  }
  async function loadRemote() {
    try {
      if (queue.length) await flush();
      if (!session) return;
      var r = await api('load', { token: session.token });
      if (!r.ok) {
        if (r.code === 'auth') { sessionExpired('登入已過期，請重新登入'); return; }
        throw new Error(r.error || 'load');
      }
      state.txs = Array.isArray(r.txs) ? r.txs : [];
      state.budget = +r.budget > 0 ? +r.budget : 0;
      state.opening = readOpening(r.opening);
      state.loaded = true; state.error = '';
      saveCache(); render(); setSync('已同步');
      maybeMigrate();
    } catch (err) {
      var c = loadCache();
      if (c) {
        state.txs = c.txs; state.budget = +c.budget > 0 ? +c.budget : 0; state.opening = readOpening(c.opening);
        state.loaded = true; state.error = '';
        render(); setSync('離線中，顯示上次的資料');
        setTimeout(flush, 8000);
      } else {
        state.loaded = true;
        state.error = '連不上伺服器，請檢查網路後重新整理頁面。';
        render();
      }
    }
  }
  // 以前在這個瀏覽器記的舊帳目，第一次登入時問要不要搬進帳號
  function maybeMigrate() {
    try {
      var flag = 'ledger.migrated.' + session.user;
      if (localStorage.getItem(flag)) return;
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) { localStorage.setItem(flag, '1'); return; }
      var o = JSON.parse(raw);
      var old = (Array.isArray(o.txs) ? o.txs : []).filter(function (t) { return t && !t.sample && t.id; });
      if (!old.length || state.txs.length > 0) { if (!old.length) localStorage.setItem(flag, '1'); return; }
      localStorage.setItem(flag, '1');
      if (!confirm('這個瀏覽器裡有 ' + old.length + ' 筆以前記的帳目，要搬進你的帳號嗎？（只會問這一次）')) return;
      state.txs = old.slice();
      for (var i = 0; i < old.length; i += 100) queue.push({ a: 'add', p: { txs: old.slice(i, i + 100) } });
      var ob = readOpening(o.opening), bg = +o.budget > 0 ? +o.budget : 0;
      if (bg > 0 || ob.cash > 0 || ob.debit > 0) {
        state.budget = bg; state.opening = ob;
        queue.push({ a: 'settings', p: { budget: bg, opening: ob } });
      }
      saveQueue(); saveCache(); render(); flush();
    } catch (e) { /* 搬不了就算了 */ }
  }
  async function bootSheet() {
    state.mode = 'sheet';
    try { session = JSON.parse(localStorage.getItem(SES_KEY) || 'null'); } catch (e) { session = null; }
    if (session && session.token && session.exp > Date.now()) { afterLogin(); }
    else { session = null; showAuth(); }
  }

  function saveBudget(n) { return saveSettings({ budget: n }); }

  async function boot() {
    render();
    if (USE_SHEET) { bootSheet(); return; }
    var mode = 'local';
    try {
      var c = window.claude;
      if (c && typeof c.use === 'function') {
        var res = await Promise.all([c.use('db'), c.use('user')]);
        var db = res[0], user = res[1];
        if (db && user) {
          var uid = await user.id();
          var canWrite = await user.can('data.write');
          if (uid && canWrite !== false) {
            var base = db.doc('data/users/' + uid + '/ledger');
            cloud = { txCol: base.collection('tx'), metaDoc: base };
            mode = 'cloud';
          }
        }
      }
    } catch (e) { mode = 'local'; cloud = null; }
    state.mode = mode;
    if (mode === 'cloud') {
      subscribe();
      setTimeout(function () { if (!state.loaded) { state.loaded = true; render(); } }, 6000);
    } else {
      loadLocal();
      render();
    }
  }

  function subscribe() {
    cloud.txCol.onSnapshot(function (snap) {
      if (!state.loaded && snap.metadata.fromCache && snap.empty) return;
      state.txs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.loaded = true;
      state.error = '';
      render();
    }, function () {
      state.loaded = true;
      state.error = '暫時讀不到雲端帳本，請重新整理頁面再試一次。';
      render();
    });
    cloud.metaDoc.onSnapshot(function (s) {
      var d = s.data();
      state.budget = d && +d.budget > 0 ? +d.budget : 0;
      state.opening = readOpening(d && d.opening);
      render();
    }, function () { /* 預算讀不到時維持原狀 */ });
  }

  /* ---------- 計算 ---------- */
  function monthList() {
    var pre = state.view.y + '-' + pad(state.view.m) + '-';
    return state.txs.filter(function (t) {
      return t && typeof t.date === 'string' && t.date.indexOf(pre) === 0 &&
        (t.type === 'expense' || t.type === 'income') && isFinite(t.amount);
    });
  }
  function niceMax(v) {
    if (v <= 0) return 100;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var ks = [1, 2, 4, 5, 10];
    for (var i = 0; i < ks.length; i++) { if (ks[i] * p >= v) return ks[i] * p; }
    return 10 * p;
  }
  function axisFmt(n) { return 'NT$' + n.toLocaleString('zh-TW', { maximumFractionDigits: 1 }); }

  /* ---------- 繪製 ---------- */
  function render() {
    var md = monthList();
    renderHeader();
    renderSummary(md);
    renderAssets();
    renderAccounts(md);
    renderBreakdown(md);
    renderChart(md);
    renderList(md);
    renderBulk(md);
    renderNote();
    renderSubmit();
  }

  function renderHeader() {
    var v = state.view;
    $('month-label').textContent = v.y + '年' + v.m + '月';
    $('this-month').disabled = (v.y === T0.y && v.m === T0.m);
    var wd = new Date(T0.y, T0.m - 1, T0.d).getDay();
    $('today-line').textContent = '今天 ' + T0.m + '月' + T0.d + '日 週' + WD[wd];
  }

  function renderSummary(md) {
    var exp = 0, inc = 0;
    md.forEach(function (t) { if (t.type === 'expense') exp += t.amount; else inc += t.amount; });
    var v = state.view;
    var dim = new Date(v.y, v.m, 0).getDate();
    var elapsed = 0;
    if (v.y === T0.y && v.m === T0.m) elapsed = T0.d;
    else if (v.y < T0.y || (v.y === T0.y && v.m < T0.m)) elapsed = dim;

    if (!state.loaded) {
      $('sum-expense').innerHTML = '<small>NT$</small>—';
      $('sum-income').textContent = '—';
      $('sum-balance').textContent = '—';
      $('sum-avg').textContent = '—';
    } else {
      $('sum-expense').innerHTML = '<small>NT$</small>' + Math.round(exp).toLocaleString('zh-TW');
      $('sum-income').textContent = money(inc);
      $('sum-income').className = inc > 0 ? 'pos' : '';
      var bal = inc - exp;
      $('sum-balance').textContent = (bal === 0 ? '' : (bal > 0 ? '+' : '−')) + money(Math.abs(bal));
      $('sum-balance').className = bal < 0 ? 'neg-bal' : (bal > 0 ? 'pos' : '');
      $('sum-avg').textContent = elapsed > 0 && exp > 0 ? money(exp / elapsed) : '—';
    }
    renderBudget(exp);
  }

  function renderBudget(exp) {
    var area = $('budget-area');
    $('budget-form').hidden = !state.editingBudget;
    area.hidden = state.editingBudget;
    if (state.editingBudget) return;
    if (!state.loaded) { area.innerHTML = ''; return; }
    if (!(state.budget > 0)) {
      area.innerHTML = '<div class="budget"><button type="button" class="link" id="budget-open">設定每月預算</button></div>';
      return;
    }
    var ratio = exp / state.budget;
    var over = exp > state.budget;
    var hot = over || ratio >= 0.85;
    var left = state.budget - exp;
    var tail = over ? '超支 ' + money(-left) : (ratio >= 0.85 ? '接近上限，' : '') + '還剩 ' + money(left);
    var pct = Math.round(ratio * 100);
    area.innerHTML =
      '<div class="budget">' +
      '<div class="b-top"><span>預算 ' + money(state.budget) + '</span>' +
      '<span class="b-state' + (hot ? ' hot' : '') + '">已用 ' + pct + '%・' + tail + '</span></div>' +
      '<div class="meter' + (hot ? ' hot' : '') + '" role="progressbar" aria-label="本月預算使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.min(100, pct) + '"><i style="width:' + Math.min(100, ratio * 100) + '%"></i></div>' +
      '<button type="button" class="link" id="budget-open">調整預算</button></div>';
  }

  function renderAssets() {
    var tEl = $('assets-total'), rEl = $('assets-rows');
    $('open-form').hidden = !state.editingOpening;
    $('open-edit').hidden = state.editingOpening;
    rEl.hidden = state.editingOpening;
    if (!state.loaded) { tEl.className = 'big'; tEl.innerHTML = '<small>NT$</small>—'; rEl.innerHTML = ''; return; }
    var acc = { cash: { inc: 0, exp: 0, n: 0 }, debit: { inc: 0, exp: 0, n: 0 }, none: { inc: 0, exp: 0, n: 0 } };
    state.txs.forEach(function (t) {
      if (!t || (t.type !== 'expense' && t.type !== 'income') || !isFinite(t.amount)) return;
      var k = (t.method === 'cash' || t.method === 'debit') ? t.method : 'none';
      acc[k].n++;
      if (t.type === 'expense') acc[k].exp += t.amount; else acc[k].inc += t.amount;
    });
    var bal = {
      cash: state.opening.cash + acc.cash.inc - acc.cash.exp,
      debit: state.opening.debit + acc.debit.inc - acc.debit.exp,
      none: acc.none.inc - acc.none.exp
    };
    var total = bal.cash + bal.debit + (acc.none.n ? bal.none : 0);
    tEl.className = 'big' + (total < 0 ? ' neg-bal' : '');
    tEl.innerHTML = bigMoney(total);
    var rows = [['現金', bal.cash], ['金融卡', bal.debit]];
    if (acc.none.n) rows.push(['未指定帳戶', bal.none]);
    rEl.innerHTML = rows.map(function (r) {
      return '<div class="arow"><span>' + r[0] + '</span><span class="aval' + (r[1] < 0 ? ' neg-bal' : '') + '">' + (r[1] < 0 ? '−' : '') + money(Math.abs(r[1])) + '</span></div>';
    }).join('');
  }

  function renderAccounts(md) {
    var el = $('accounts');
    if (!state.loaded) { el.innerHTML = '<p class="empty">正在讀取帳本…</p>'; return; }
    var acc = { cash: { inc: 0, exp: 0, n: 0 }, debit: { inc: 0, exp: 0, n: 0 }, none: { inc: 0, exp: 0, n: 0 } };
    md.forEach(function (t) {
      var k = (t.method === 'cash' || t.method === 'debit') ? t.method : 'none';
      acc[k].n++;
      if (t.type === 'expense') acc[k].exp += t.amount; else acc[k].inc += t.amount;
    });
    var keys = ['cash', 'debit'];
    if (acc.none.n) keys.push('none');
    el.innerHTML = '<div class="acct-list">' + keys.map(function (k) {
      var a = acc[k], bal = a.inc - a.exp;
      return '<div class="acct"><div class="acct-name">' + (k === 'none' ? '未指定' : mname(k)) + '</div>' +
        '<dl class="acct-stats">' +
        '<div><dt>收入</dt><dd class="' + (a.inc > 0 ? 'pos' : '') + '">' + money(a.inc) + '</dd></div>' +
        '<div><dt>支出</dt><dd>' + money(a.exp) + '</dd></div>' +
        '<div><dt>結餘</dt><dd class="' + (bal < 0 ? 'neg-bal' : (bal > 0 ? 'pos' : '')) + '">' + (bal === 0 ? '' : (bal > 0 ? '+' : '−')) + money(Math.abs(bal)) + '</dd></div>' +
        '</dl></div>';
    }).join('') + '</div>';
  }

  function renderBreakdown(md) {
    var el = $('breakdown');
    if (!state.loaded) { el.innerHTML = '<p class="empty">正在讀取帳本…</p>'; $('bd-total').textContent = ''; return; }
    var by = {}, total = 0;
    md.forEach(function (t) {
      if (t.type !== 'expense') return;
      by[t.category] = (by[t.category] || 0) + t.amount;
      total += t.amount;
    });
    var rows = Object.keys(by).map(function (k) { return [k, by[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    if (!rows.length) {
      el.innerHTML = '<p class="empty">這個月還沒有支出紀錄。</p>';
      $('bd-total').textContent = '';
      return;
    }
    $('bd-total').textContent = '共 ' + money(total);
    var max = rows[0][1];
    el.innerHTML = '<div class="bd">' + rows.map(function (r) {
      return '<div class="bd-row"><div class="bd-top"><span>' + esc(r[0]) + '</span>' +
        '<span class="bd-amt">' + money(r[1]) + '<span class="bd-pct">' + Math.round(r[1] / total * 100) + '%</span></span></div>' +
        '<div class="bd-track"><i style="width:' + (r[1] / max * 100) + '%"></i></div></div>';
    }).join('') + '</div>';
  }

  function readoutText(i) {
    var c = state.chart;
    if (!c) return '';
    if (i == null) {
      var mi = 0;
      c.vals.forEach(function (v, k) { if (v > c.vals[mi]) mi = k; });
      return '單日最高 ' + state.view.m + '/' + (mi + 1) + '・' + money(c.vals[mi]);
    }
    var d = i + 1;
    var w = new Date(state.view.y, state.view.m - 1, d).getDay();
    var head = state.view.m + '/' + d + ' 週' + WD[w] + '　';
    return head + (c.vals[i] > 0 ? '支出 ' + money(c.vals[i]) + '（' + c.cnt[i] + ' 筆）' : '沒有支出');
  }

  function renderChart(md) {
    var v = state.view;
    var n = new Date(v.y, v.m, 0).getDate();
    var vals = [], cnt = [], i;
    for (i = 0; i < n; i++) { vals.push(0); cnt.push(0); }
    var total = 0;
    md.forEach(function (t) {
      if (t.type !== 'expense') return;
      var d = parseInt(t.date.slice(8, 10), 10);
      if (d >= 1 && d <= n) { vals[d - 1] += t.amount; cnt[d - 1]++; total += t.amount; }
    });
    state.chart = { n: n, vals: vals, cnt: cnt, total: total };
    state.sel = null;
    var el = $('daily-chart');
    if (!state.loaded) { el.innerHTML = '<p class="empty">正在讀取帳本…</p>'; $('chart-readout').textContent = ''; return; }
    if (total === 0) {
      el.innerHTML = '<p class="empty">這個月還沒有支出，記下第一筆就會出現長條圖。</p>';
      $('chart-readout').textContent = '';
      return;
    }
    var max = niceMax(Math.max.apply(null, vals));
    var cols = '', labels = '';
    var isCur = (v.y === T0.y && v.m === T0.m);
    for (i = 0; i < n; i++) {
      var d2 = i + 1;
      var h = vals[i] > 0 ? (vals[i] / max * 100) : 0;
      cols += '<div class="col" data-i="' + i + '"><i class="' + (vals[i] > 0 ? '' : 'zero') + '"' + (vals[i] > 0 ? ' style="height:' + h + '%"' : '') + '></i></div>';
      var show = d2 === 1 || d2 === n || (d2 % 5 === 0 && n - d2 >= 3);
      labels += '<div class="xl' + (isCur && d2 === T0.d ? ' today' : '') + '">' + (show ? '<span>' + d2 + '</span>' : '') + '</div>';
    }
    el.innerHTML =
      '<div class="chart" style="--n:' + n + '">' +
      '<div class="yaxis"><span>' + axisFmt(max) + '</span><span>' + axisFmt(max / 2) + '</span><span>0</span></div>' +
      '<div class="plot"><div class="gl g100"></div><div class="gl g50"></div><div class="gl g0"></div>' +
      '<div class="bars" id="bars" tabindex="0" role="group" aria-label="每日支出長條圖，可用左右方向鍵逐日查看" style="--n:' + n + '">' + cols + '</div></div>' +
      '<div></div><div class="xaxis" style="--n:' + n + '">' + labels + '</div></div>';
    $('chart-readout').textContent = readoutText(null);
  }

  function setSel(i) {
    state.sel = i;
    var bars = $('bars');
    if (!bars) return;
    bars.classList.toggle('has-sel', i != null);
    var cols = bars.querySelectorAll('.col');
    for (var k = 0; k < cols.length; k++) cols[k].classList.toggle('sel', k === i);
    $('chart-readout').textContent = readoutText(i);
  }

  function renderList(md) {
    var el = $('list');
    $('export').disabled = state.txs.length === 0;
    if (!state.loaded) { el.innerHTML = '<p class="empty">正在讀取帳本…</p>'; $('sample-note').innerHTML = ''; return; }
    if (state.error) { el.innerHTML = '<p class="empty">' + esc(state.error) + '</p>'; return; }
    if (state.txs.length === 0) {
      el.innerHTML = '<div class="empty"><p>還沒有任何帳目。</p><p>從「記一筆」開始，或先載入範例資料看看版面。</p>' +
        '<button type="button" class="ghost" id="sample-load">載入範例資料</button></div>';
      $('sample-note').innerHTML = '';
      return;
    }
    var items = md.filter(function (t) { return state.filter === 'all' || t.type === state.filter; });
    items.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    if (!items.length) {
      el.innerHTML = '<p class="empty">' + (md.length ? '沒有符合篩選的帳目。' : '這個月還沒有帳目。') + '</p>';
    } else {
      var groups = [], cur = null;
      items.forEach(function (t) {
        if (!cur || cur.date !== t.date) { cur = { date: t.date, items: [] }; groups.push(cur); }
        cur.items.push(t);
      });
      el.innerHTML = groups.map(function (g) {
        var p = g.date.split('-');
        var w = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
        var e = 0, i2 = 0;
        g.items.forEach(function (t) { if (t.type === 'expense') e += t.amount; else i2 += t.amount; });
        var sums = [];
        if (e > 0) sums.push('支出 ' + money(e));
        if (i2 > 0) sums.push('收入 ' + money(i2));
        return '<section class="day"><h3 class="day-head"><span class="d">' + (+p[1]) + '/' + (+p[2]) + ' 週' + WD[w] + '</span><span>' + sums.join('・') + '</span></h3><ul>' +
          g.items.map(function (t) {
            var inc = t.type === 'income';
            var conf = state.confirmId === t.id;
            var label = esc(t.category) + ' ' + money(t.amount);
            return '<li class="tx"><div class="tx-main"><span class="tag' + (inc ? ' inc' : '') + '">' + esc(t.category) + '</span>' +
              (mname(t.method) ? '<span class="tag m">' + mname(t.method) + '</span>' : '') +
              (t.sample ? '<span class="tag sample">範例</span>' : '') +
              (t.note ? '<span class="tx-note">' + esc(t.note) + '</span>' : '') + '</div>' +
              '<div class="tx-amt' + (inc ? ' inc' : '') + '">' + (inc ? '+' : '−') + money(t.amount) + '</div>' +
              '<button type="button" class="del' + (conf ? ' is-confirm' : '') + '" data-del="' + esc(t.id) + '" aria-label="' + (conf ? '確定刪除 ' : '刪除 ') + label + '">' + (conf ? '確定刪除' : '刪除') + '</button></li>';
          }).join('') + '</ul></section>';
      }).join('');
    }
    var hasSample = state.txs.some(function (t) { return t.sample; });
    $('sample-note').innerHTML = hasSample ? '目前含範例資料 <button type="button" class="link" id="sample-clear">清除範例</button>' : '';
  }

  function renderBulk(md) {
    var cm = $('clear-month'), ca = $('clear-all');
    cm.disabled = !state.loaded || md.length === 0;
    ca.disabled = !state.loaded || state.txs.length === 0;
    var m1 = state.confirmBulk === 'month', a1 = state.confirmBulk === 'all';
    cm.textContent = m1 ? '確定清除本月 ' + md.length + ' 筆？' : '清除本月';
    ca.textContent = a1 ? '確定清除全部 ' + state.txs.length + ' 筆？' : '清除全部';
    cm.classList.toggle('is-confirm', m1);
    ca.classList.toggle('is-confirm', a1);
  }

  function renderNote() {
    var s = '';
    if (state.mode === 'sheet') s = '帳目存在你的帳號裡，換手機或電腦登入同一個帳號就能接著記。網站管理者看得到所有帳號的帳目。';
    else if (state.mode === 'cloud') s = '帳目存在你的帳號裡，只有登入的你看得到，換手機或電腦也能接著記。';
    else if (state.mode === 'local') s = state.persistFail
      ? '這個瀏覽器不允許儲存資料，關閉頁面後帳目會消失。請先匯出 CSV 備份。'
      : '帳目只存在這個瀏覽器，清除網站資料後會消失。建議定期匯出 CSV 備份。';
    $('store-note').textContent = s;
  }

  function renderSubmit() {
    var b = $('submit');
    b.disabled = !state.loaded;
    b.textContent = state.loaded ? '記一筆' : '載入中…';
  }

  function renderChips() {
    var cats = state.type === 'expense' ? EXPENSE_CATS : INCOME_CATS;
    var sel = state.lastCat[state.type];
    $('cat-chips').innerHTML = cats.map(function (c, i) {
      var id = 'cat-' + state.type + '-' + i;
      return '<input type="radio" name="cat" id="' + id + '" value="' + esc(c) + '"' + (c === sel ? ' checked' : '') + '><label for="' + id + '">' + esc(c) + '</label>';
    }).join('');
  }

  /* ---------- 互動 ---------- */
  function toast(msg, bad) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 2600);
  }
  function showErr(msg) { var e = $('form-err'); e.textContent = msg; e.hidden = false; }
  function hideErr() { $('form-err').hidden = true; }

  function setView(y, m) {
    state.view = { y: y, m: m };
    state.confirmId = null;
    state.confirmBulk = null;
    var dv = $('date').value;
    var pre = y + '-' + pad(m) + '-';
    if (dv.indexOf(pre) !== 0) {
      $('date').value = (y === T0.y && m === T0.m) ? dstr(T0.y, T0.m, T0.d) : dstr(y, m, 1);
    }
    render();
  }
  function shiftMonth(delta) {
    var d = new Date(state.view.y, state.view.m - 1 + delta, 1);
    setView(d.getFullYear(), d.getMonth() + 1);
  }

  $('prev').addEventListener('click', function () { shiftMonth(-1); });
  $('next').addEventListener('click', function () { shiftMonth(1); });
  $('this-month').addEventListener('click', function () { setView(T0.y, T0.m); });

  document.querySelectorAll('input[name="type"]').forEach(function (r) {
    r.addEventListener('change', function () {
      state.type = r.value;
      renderChips();
    });
  });
  $('cat-chips').addEventListener('change', function (e) {
    if (e.target && e.target.name === 'cat') state.lastCat[state.type] = e.target.value;
  });
  $('amount').addEventListener('input', hideErr);

  $('entry-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!state.loaded) return;
    var amt = Math.round(Number($('amount').value));
    var date = $('date').value;
    var note = $('note').value.trim();
    var catEl = document.querySelector('input[name="cat"]:checked');
    var cat = catEl ? catEl.value : '其他';
    var mEl = document.querySelector('input[name="method"]:checked');
    var method = mEl ? mEl.value : 'cash';
    if (!(amt > 0)) { showErr('請輸入大於 0 的金額。'); $('amount').focus(); return; }
    if (amt > 999999999) { showErr('金額太大了，請確認一下位數。'); $('amount').focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showErr('請選擇日期。'); $('date').focus(); return; }
    hideErr();
    var btn = $('submit');
    btn.disabled = true;
    try {
      await addTx({ type: state.type, amount: amt, category: cat, method: method, note: note, date: date });
      toast('已記錄 ' + mname(method) + '・' + cat + ' ' + money(amt));
      if (window.__roast) { try { window.__roast({ type: state.type, amount: amt, category: cat }); } catch (e3) {} }
      $('amount').value = '';
      $('note').value = '';
      var y = +date.slice(0, 4), m = +date.slice(5, 7);
      if (y !== state.view.y || m !== state.view.m) setView(y, m);
      $('amount').focus();
    } catch (err) {
      toast('儲存失敗，請稍後再試。', true);
    } finally {
      btn.disabled = !state.loaded;
    }
  });

  /* 預算 */
  $('budget-area').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'budget-open') {
      state.editingBudget = true;
      renderSummary(monthList());
      var inp = $('budget-input');
      inp.value = state.budget > 0 ? state.budget : '';
      inp.focus();
    }
  });
  $('budget-cancel').addEventListener('click', function () {
    state.editingBudget = false;
    renderSummary(monthList());
  });
  $('budget-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var val = Math.round(Number($('budget-input').value));
    if (!(val >= 0)) { toast('請輸入 0 以上的預算金額。', true); return; }
    try {
      await saveBudget(val);
      state.editingBudget = false;
      render();
      toast(val > 0 ? '已設定每月預算 ' + money(val) : '已清除預算');
    } catch (err) {
      toast('儲存失敗，請稍後再試。', true);
    }
  });

  /* 起始金額 */
  $('open-edit').addEventListener('click', function () {
    state.editingOpening = true;
    $('open-cash').value = state.opening.cash > 0 ? state.opening.cash : '';
    $('open-debit').value = state.opening.debit > 0 ? state.opening.debit : '';
    renderAssets();
    $('open-cash').focus();
  });
  $('open-cancel').addEventListener('click', function () {
    state.editingOpening = false;
    renderAssets();
  });
  $('open-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var c = Math.round(Number($('open-cash').value || 0));
    var d = Math.round(Number($('open-debit').value || 0));
    if (!(c >= 0) || !(d >= 0)) { toast('起始金額請輸入 0 以上的數字。', true); return; }
    try {
      await saveSettings({ opening: { cash: c, debit: d } });
      state.editingOpening = false;
      render();
      toast('已更新起始金額');
    } catch (err) {
      toast('儲存失敗，請稍後再試。', true);
    }
  });

  /* 篩選 */
  document.querySelectorAll('input[name="filter"]').forEach(function (r) {
    r.addEventListener('change', function () { state.filter = r.value; renderList(monthList()); });
  });

  /* 刪除（兩段式確認） */
  $('list').addEventListener('click', async function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var del = t.closest('[data-del]');
    if (del) {
      var id = del.getAttribute('data-del');
      if (state.confirmId === id) {
        clearTimeout(confirmTimer);
        state.confirmId = null;
        try { await removeTx(id); toast('已刪除'); }
        catch (err) { toast('刪除失敗，請稍後再試。', true); renderList(monthList()); }
      } else {
        state.confirmId = id;
        renderList(monthList());
        var again = $('list').querySelector('[data-del="' + id.replace(/"/g, '') + '"]');
        if (again) again.focus();
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(function () {
          if (state.confirmId === id) { state.confirmId = null; renderList(monthList()); }
        }, 3500);
      }
      return;
    }
    if (t.id === 'sample-load') loadSample(t);
  });
  $('sample-note').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'sample-clear') clearSample(e.target);
  });

  /* 整批清除（兩段式確認） */
  async function bulkClear(kind) {
    var list = kind === 'month' ? monthList() : state.txs;
    var ids = list.map(function (t) { return t.id; });
    if (!ids.length) return;
    if (state.confirmBulk !== kind) {
      state.confirmBulk = kind;
      renderBulk(monthList());
      clearTimeout(bulkTimer);
      bulkTimer = setTimeout(function () { state.confirmBulk = null; renderBulk(monthList()); }, 4000);
      return;
    }
    clearTimeout(bulkTimer);
    state.confirmBulk = null;
    try {
      await removeMany(ids);
      toast('已清除 ' + ids.length + ' 筆帳目');
    } catch (err) {
      toast('清除失敗，請稍後再試。', true);
    }
    render();
  }
  $('clear-month').addEventListener('click', function () { bulkClear('month'); });
  $('clear-all').addEventListener('click', function () { bulkClear('all'); });

  /* 範例資料 */
  async function loadSample(btn) {
    btn.disabled = true;
    var D = function (d) { return dstr(T0.y, T0.m, Math.max(1, Math.min(d, T0.d))); };
    var rows = [
      [1, 'income', '薪資', 42000, '本月薪資', 'debit'],
      [1, 'expense', '居家水電', 12500, '房租', 'debit'],
      [2, 'expense', '餐飲', 95, '早餐 蛋餅豆漿', 'cash'],
      [3, 'expense', '交通', 500, '悠遊卡加值', 'cash'],
      [4, 'expense', '餐飲', 180, '午餐 滷肉飯', 'cash'],
      [6, 'expense', '購物', 1290, '球鞋', 'debit'],
      [8, 'expense', '娛樂', 320, '電影', 'debit'],
      [9, 'expense', '餐飲', 560, '朋友聚餐', 'cash'],
      [12, 'expense', '居家水電', 1480, '電費', 'debit'],
      [15, 'income', '兼職', 3000, '接案', 'debit'],
      [18, 'expense', '醫療', 250, '掛號費', 'cash'],
      [21, 'expense', '學習', 680, '線上課程', 'debit']
    ];
    try {
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        await addTx({ type: r[1], amount: r[3], category: r[2], method: r[5], note: r[4], date: D(r[0]), sample: true });
      }
      if (state.view.y !== T0.y || state.view.m !== T0.m) setView(T0.y, T0.m);
      toast('已載入範例資料，隨時可以清除');
    } catch (err) {
      toast('載入範例失敗，請稍後再試。', true);
      btn.disabled = false;
    }
  }
  async function clearSample(btn) {
    btn.disabled = true;
    var ids = state.txs.filter(function (t) { return t.sample; }).map(function (t) { return t.id; });
    try {
      for (var i = 0; i < ids.length; i++) await removeTx(ids[i]);
      toast('已清除範例資料');
    } catch (err) {
      toast('清除失敗，請稍後再試。', true);
    }
  }

  /* 每日長條圖：滑過、點選、左右鍵 */
  var chartEl = $('daily-chart');
  function idxFromEvent(e) {
    var bars = $('bars');
    if (!bars || !state.chart) return null;
    var r = bars.getBoundingClientRect();
    var x = e.clientX - r.left;
    if (x < 0 || x > r.width) return null;
    return Math.min(state.chart.n - 1, Math.max(0, Math.floor(x / r.width * state.chart.n)));
  }
  chartEl.addEventListener('pointermove', function (e) {
    if (!e.target.closest || !e.target.closest('.bars')) return;
    var i = idxFromEvent(e);
    if (i != null && i !== state.sel) setSel(i);
  });
  chartEl.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('.bars')) return;
    var i = idxFromEvent(e);
    if (i != null) setSel(i);
  });
  chartEl.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && document.activeElement !== $('bars')) setSel(null);
  });
  chartEl.addEventListener('keydown', function (e) {
    if (!e.target || e.target.id !== 'bars' || !state.chart) return;
    var n = state.chart.n, cur = state.sel;
    var next = null;
    if (e.key === 'ArrowRight') next = cur == null ? 0 : Math.min(n - 1, cur + 1);
    else if (e.key === 'ArrowLeft') next = cur == null ? n - 1 : Math.max(0, cur - 1);
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = n - 1;
    else if (e.key === 'Escape') { setSel(null); return; }
    if (next != null) { e.preventDefault(); setSel(next); }
  });

  /* 匯出 CSV */
  function csvCell(v) {
    var s = String(v);
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  $('export').addEventListener('click', async function () {
    if (!state.txs.length) return;
    var rows = state.txs.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    var lines = [['日期', '類型', '類別', '帳戶', '金額', '備註']].concat(rows.map(function (t) {
      return [t.date, t.type === 'income' ? '收入' : '支出', t.category, mname(t.method), t.amount, t.note || ''];
    })).map(function (r) { return r.map(csvCell).join(','); });
    var csv = '﻿' + lines.join('\r\n');
    try {
      var fname = '記帳本_' + dstr(T0.y, T0.m, T0.d) + '.csv';
      var dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) {
        await dl.save({ filename: fname, data: csv });
      } else {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }
      toast('已匯出 CSV');
    } catch (err) {
      if (err && err.code === 'declined') return;
      toast('匯出失敗，請稍後再試。', true);
    }
  });

  /* 初始化 */
  $('date').value = dstr(T0.y, T0.m, T0.d);
  renderChips();
  boot();
})();
</script>
